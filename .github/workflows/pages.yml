name: Publish game to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static game files
        run: |
          mkdir -p dist/assets
          cp index.html menu.js game.js tank-preview.js styles.css dist/
          cp -R data dist/data
          cp -R assets/audio assets/levels assets/tanks dist/assets/
          find dist/assets -type f \( -name '*.blend' -o -name '*.blend1' -o -name '*.hdr' \) -delete
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
